<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steve Lacy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="artist-page steve-bg">

  <header class="top-bar">
    <div class="glass-badge artist-name-box">Steve Lacy</div>
    <a href="index.html" class="glass-badge home-btn">На главную</a>
  </header>

  <main class="merch-grid">
    
    <div class="merch-item">
      <div class="merch-img-box">
        <img src="images/sls.jpg" alt="Лонгслив Steve Lacy">
      </div>
      <button class="buy-btn-dark">Buy</button>
    </div>

    <div class="merch-item">
      <div class="merch-img-box">
        <img src="images/shirt.jpg" alt="Футболка Steve Lacy">
      </div>
      <button class="buy-btn-dark">Buy</button>
    </div>

    <div class="merch-item">
      <div class="merch-img-box">
        <img src="images/slh.jpg" alt="Худи Steve Lacy">
      </div>
      <button class="buy-btn-dark">Buy</button>
    </div>

  </main>

</body>
</html>
